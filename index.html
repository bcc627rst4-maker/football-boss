<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Boss</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1020;
    color:#fff;
}
button{
    border:0;
    border-radius:8px;
    padding:12px 16px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
button:hover{opacity:.85}
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}
.header{
    background:#111827;
    padding:18px;
    border-bottom:1px solid #273244;
    position:sticky;
    top:0;
    z-index:10;
}
.header h1{margin:0 0 5px}
.muted{color:#9ca3af}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}
.card{
    background:#151d2e;
    border:1px solid #263248;
    border-radius:12px;
    padding:18px;
}
.club{
    cursor:pointer;
    transition:.2s;
}
.club:hover{
    transform:translateY(-3px);
    border-color:#3b82f6;
}
.club h2{margin-top:0}
.stat{
    font-size:24px;
    font-weight:bold;
}
.nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 0;
}
.nav button{
    white-space:nowrap;
    background:#1f2937;
}
.nav button.active{background:#2563eb}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:10px 7px;
    text-align:left;
    border-bottom:1px solid #263248;
}
.player{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
.badge{
    display:inline-block;
    background:#263248;
    padding:4px 7px;
    border-radius:5px;
    font-size:12px;
}
.green{color:#4ade80}
.yellow{color:#facc15}
.red{color:#f87171}
.big{
    font-size:36px;
    font-weight:bold;
}
.bar{
    height:8px;
    background:#263248;
    border-radius:10px;
    overflow:hidden;
}
.bar span{
    display:block;
    height:100%;
    background:#3b82f6;
}
.hidden{display:none}
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}
.modalBox{
    background:#151d2e;
    border:1px solid #334155;
    border-radius:12px;
    padding:22px;
    max-width:500px;
    width:100%;
}
input,select{
    width:100%;
    padding:11px;
    margin:6px 0 12px;
    border-radius:7px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   FOOTBALL BOSS
   ========================================================= */

const clubs = {

Barcelona:{
    name:"Barcelona",
    country:"Spain",
    league:"La Liga",
    budget:100000000,
    wageBudget:2500000,
    reputation:95,
    expectation:"Win La Liga and compete for the Champions League",
    stadium:"Spotify Camp Nou"
},

RealMadrid:{
    name:"Real Madrid",
    country:"Spain",
    league:"La Liga",
    budget:140000000,
    wageBudget:3000000,
    reputation:98,
    expectation:"Win La Liga and Champions League",
    stadium:"Santiago Bernabéu"
},

ManchesterCity:{
    name:"Manchester City",
    country:"England",
    league:"Premier League",
    budget:160000000,
    wageBudget:3200000,
    reputation:97,
    expectation:"Win the Premier League and compete for Champions League",
    stadium:"Etihad Stadium"
},

Liverpool:{
    name:"Liverpool",
    country:"England",
    league:"Premier League",
    budget:110000000,
    wageBudget:2400000,
    reputation:92,
    expectation:"Challenge for the Premier League",
    stadium:"Anfield"
},

Bayern:{
    name:"Bayern Munich",
    country:"Germany",
    league:"Bundesliga",
    budget:120000000,
    wageBudget:2600000,
    reputation:94,
    expectation:"Win the Bundesliga and compete in Europe",
    stadium:"Allianz Arena"
},

Inter:{
    name:"Inter Milan",
    country:"Italy",
    league:"Serie A",
    budget:75000000,
    wageBudget:1800000,
    reputation:88,
    expectation:"Challenge for Serie A",
    stadium:"San Siro"
}

};


/* =========================================================
   PLAYER DATABASE
   ========================================================= */

const players = [

["p1","Marc-André ter Stegen","GK",89,33,18000000,200000],
["p2","Iñaki Peña","GK",74,27,6000000,50000],
["p3","Wojciech Szczęsny","GK",80,36,3000000,70000],

["p4","Jules Koundé","RB",88,27,65000000,180000],
["p5","João Cancelo","RB",84,32,22000000,180000],
["p6","Ronald Araújo","CB",89,27,75000000,220000],
["p7","Pau Cubarsí","CB",86,19,70000000,80000],
["p8","Andreas Christensen","CB",89,30,35000000,170000],
["p9","Eric García","CB",79,25,18000000,80000],
["p10","Alejandro Balde","LB",84,22,45000000,100000],

["p11","Frenkie de Jong","CM",89,29,75000000,250000],
["p12","Pedri","CM",92,23,130000000,300000],
["p13","Gavi","CM",22,21,90000000,220000],
["p14","Fermín López","AM",82,23,35000000,80000],
["p15","Dani Olmo","AM",87,28,60000000,180000],

["p16","Lamine Yamal","RW",94,19,180000000,300000],
["p17","Raphinha","LW",89,29,80000000,240000],
["p18","Ferran Torres","ST",82,26,30000000,130000],
["p19","Robert Lewandowski","ST",90,38,15000000,280000],
["p20","Marcus Rashford","LW",86,28,55000000,220000]

];


/* =========================================================
   CREATE PLAYER OBJECTS
   ========================================================= */

function createPlayer(p){

return {
    id:p[0],
    name:p[1],
    position:p[2],
    overall:p[3],
    age:p[4],
    value:p[5],
    wage:p[6],
    morale:85,
    fitness:100,
    sharpness:90,
    goals:0,
    assists:0,
    appearances:0,
    yellow:0,
    red:0,
    contract:3,
    status:"Fit"
};

}


/* =========================================================
   GAME STATE
   ========================================================= */

let game = JSON.parse(localStorage.getItem("footballBossSave")) || null;

function saveGame(){
    localStorage.setItem("footballBossSave",JSON.stringify(game));
}

function money(n){
    return "€"+Math.round(n/1000000)+"M";
}

function wage(n){
    return "€"+Math.round(n/1000)+"K/w";
}


/* =========================================================
   START SCREEN
   ========================================================= */

function startScreen(){

document.getElementById("app").innerHTML=`

<div class="container">

<div style="text-align:center;margin:45px 0">
<h1 style="font-size:46px">⚽ FOOTBALL BOSS</h1>
<p class="muted">
Build your club. Manage your squad. Control the finances.
Make the decisions.
</p>
</div>

<h2>Choose Your Club</h2>

<div class="grid">

${Object.keys(clubs).map(key=>{

let c=clubs[key];

return `
<div class="card club" onclick="startCareer('${key}')">

<h2>${c.name}</h2>

<p>${c.country} • ${c.league}</p>

<p class="muted">${c.stadium}</p>

<hr>

<p>Transfer budget</p>
<div class="stat">${money(c.budget)}</div>

<p>Wage budget</p>
<div>${wage(c.wageBudget)}</div>

<p class="muted">${c.expectation}</p>

</div>
`;

}).join("")}

</div>

${game ? `
<div style="text-align:center;margin-top:30px">
<button onclick="continueCareer()">CONTINUE EXISTING CAREER</button>
<button onclick="deleteSave()" style="background:#991b1b">
DELETE SAVE
</button>
</div>
`:""}

</div>
`;

}


/* =========================================================
   START CAREER
   ========================================================= */

function startCareer(clubKey){

let club=clubs[clubKey];

game={

clubKey:clubKey,
club:club.name,

season:"2026/27",

date:"1 July 2026",

money:club.budget,

wageBudget:club.wageBudget,

manager:"Akhil",

boardConfidence:75,

morale:80,

formation:"4-3-3",

tactic:"Balanced",

players:players.map(createPlayer),

leaguePosition:1,

points:0,

played:0,

wins:0,

draws:0,

losses:0,

goalsFor:0,

goalsAgainst:0,

transfers:[],

fixtures:[],

news:[],

history:[],

inbox:[]

};

generateFixtures();

game.news.push(
"Welcome to "+club.name+". The board has appointed you as manager."
);

game.inbox.push(
"Your first meeting with the board is scheduled."
);

saveGame();

dashboard();

}


/* =========================================================
   CONTINUE
   ========================================================= */

function continueCareer(){

if(!game)return;

dashboard();

}


/* =========================================================
   DELETE SAVE
   ========================================================= */

function deleteSave(){

if(confirm("Delete your entire Football Boss career?")){
localStorage.removeItem("footballBossSave");
game=null;
startScreen();
}

}


/* =========================================================
   FIXTURES
   ========================================================= */

function generateFixtures(){

const opponents=[
"Real Madrid",
"Manchester City",
"Liverpool",
"Bayern Munich",
"Inter Milan",
"Atlético Madrid",
"Arsenal",
"Juventus",
"AC Milan",
"Paris Saint-Germain",
"Borussia Dortmund",
"Napoli",
"Tottenham",
"Chelsea",
"Manchester United",
"Ajax",
"Benfica",
"Porto",
"Sevilla"
];

game.fixtures=[];

for(let i=0;i<38;i++){

game.fixtures.push({

week:i+1,

opponent:opponents[i%opponents.length],

home:i%2===0,

played:false,

result:null

});

}

}


/* =========================================================
   LAYOUT
   ========================================================= */

function layout(content){

document.getElementById("app").innerHTML=`

<div class="header">

<div class="container">

<h1>⚽ Football Boss</h1>

<div class="muted">
${game.club} • ${game.season} • ${game.date}
</div>

<div class="nav">

<button onclick="dashboard()">Overview</button>
<button onclick="showSquad()">Squad</button>
<button onclick="showTactics()">Tactics</button>
<button onclick="showTransfers()">Transfers</button>
<button onclick="showFixtures()">Fixtures</button>
<button onclick="showTable()">League</button>
<button onclick="showBoard()">Board</button>
<button onclick="showInbox()">Inbox</button>

</div>

</div>

</div>

<div class="container">

${content}

</div>
`;

}


/* =========================================================
   DASHBOARD
   ========================================================= */

function dashboard(){

layout(`

<div class="grid">

<div class="card">
<div class="muted">Transfer Budget</div>
<div class="big">${money(game.money)}</div>
</div>

<div class="card">
<div class="muted">Wage Budget</div>
<div class="big">${wage(game.wageBudget)}</div>
</div>

<div class="card">
<div class="muted">Board Confidence</div>
<div class="big">${game.boardConfidence}%</div>
</div>

<div class="card">
<div class="muted">League Position</div>
<div class="big">${game.leaguePosition}</div>
</div>

</div>

<br>

<div class="grid">

<div class="card">

<h2>Season Record</h2>

<p>Played: ${game.played}</p>
<p class="green">Wins: ${game.wins}</p>
<p>Draws: ${game.draws}</p>
<p class="red">Losses: ${game.losses}</p>

</div>

<div class="card">

<h2>Next Match</h2>

${
game.fixtures.find(x=>!x.played)
?
`
<p>
<strong>
${game.fixtures.find(x=>!x.played).home ? game.club : game.fixtures.find(x=>!x.played).opponent}
</strong>
vs
<strong>
${game.fixtures.find(x=>!x.played).home ? game.fixtures.find(x=>!x.played).opponent : game.club}
</strong>
</p>

<button onclick="playNextMatch()">PLAY MATCH</button>
`
:
"<p>Season complete.</p>"
}

</div>

<div class="card">

<h2>Recent News</h2>

${game.news.slice(-5).reverse().map(n=>`<p>• ${n}</p>`).join("")}

</div>

</div>

`);

}


/* =========================================================
   SQUAD
   ========================================================= */

function showSquad(){

layout(`

<h2>First Team Squad</h2>

<div class="card">

<table>

<tr>
<th>Player</th>
<th>Pos</th>
<th>OVR</th>
<th>Age</th>
<th>Value</th>
<th>Wage</th>
<th>Morale</th>
<th>Fitness</th>
</tr>

${game.players.map(p=>`

<tr>

<td>
<strong>${p.name}</strong>
<br>
<span class="badge">${p.status}</span>
</td>

<td>${p.position}</td>

<td>${p.overall}</td>

<td>${p.age}</td>

<td>${money(p.value)}</td>

<td>${wage(p.wage)}</td>

<td class="${p.morale<60?'red':p.morale<75?'yellow':'green'}">
${p.morale}
</td>

<td>
${p.fitness}%
</td>

</tr>

`).join("")}

</table>

</div>

`);

}


/* =========================================================
   TACTICS
   ========================================================= */

function showTactics(){

layout(`

<h2>Tactics</h2>

<div class="grid">

<div class="card">

<h3>Formation</h3>

<select id="formation">

${["4-3-3","4-2-3-1","4-4-2","3-4-3","3-5-2","4-1-4-1"].map(x=>
`<option ${game.formation===x?"selected":""}>${x}</option>`
).join("")}

</select>

</div>

<div class="card">

<h3>Team Mentality</h3>

<select id="tactic">

${["Very Defensive","Defensive","Balanced","Positive","Attacking","Very Attacking"].map(x=>
`<option ${game.tactic===x?"selected":""}>${x}</option>`
).join("")}

</select>

</div>

</div>

<br>

<button onclick="saveTactics()">SAVE TACTICS</button>

`);

}


function saveTactics(){

game.formation=document.getElementById("formation").value;
game.tactic=document.getElementById("tactic").value;

game.news.push(
"Tactics changed to "+game.formation+" with a "+game.tactic+" mentality."
);

saveGame();

dashboard();

}


/* =========================================================
   TRANSFERS
   ========================================================= */

const transferTargets=[

["t1","Khvicha Kvaratskhelia","LW",90,25,95000000,220000],
["t2","Florian Wirtz","AM",91,23,120000000,250000],
["t3","Jamal Musiala","AM",92,23,140000000,280000],
["t4","Bukayo Saka","RW",91,25,130000000,270000],
["t5","Victor Osimhen","ST",89,27,90000000,250000],
["t6","Alexander Isak","ST",89,26,100000000,260000],
["t7","William Saliba","CB",90,25,90000000,220000],
["t8","Alphonso Davies","LB",88,25,70000000,180000],
["t9","Martin Ødegaard","AM",91,27,110000000,260000],
["t10","Rodri","DM",30,30,90000000,280000]

];


function showTransfers(){

layout(`

<h2>Transfer Market</h2>

<p class="muted">
Available budget: ${money(game.money)}
</p>

<div class="grid">

${transferTargets.map(p=>`

<div class="card">

<h3>${p[1]}</h3>

<p>
${p[2]} • ${p[3]} OVR • ${p[4]} years
</p>

<p>Market value: <strong>${money(p[5])}</strong></p>

<p>Wage: ${wage(p[6])}</p>

<button onclick="negotiate('${p[0]}')">
NEGOTIATE
</button>

</div>

`).join("")}

</div>

`);

}


function negotiate(id){

let p=transferTargets.find(x=>x[0]===id);

let offer=prompt(
"Enter transfer offer for "+p[1]+" (€ millions):",
Math.round(p[5]/1000000)
);

if(offer===null)return;

offer=Number(offer)*1000000;

if(isNaN(offer))return alert("Invalid amount.");

if(offer>game.money){

alert("You cannot afford this transfer.");

return;

}

let minimum=p[5]*0.85;

if(offer<minimum){

game.news.push(
p[1]+" rejected your offer of "+money(offer)+"."
);

alert("Negotiation failed. The club wants a higher fee.");

}

else{

game.money-=offer;

game.players.push(createPlayer(p));

game.players[game.players.length-1].value=p[5];
game.players[game.players.length-1].wage=p[6];

game.transfers.push({
player:p[1],
fee:offer
});

game.news.push(
"Transfer completed: "+p[1]+" joined for "+money(offer)+"."
);

alert("TRANSFER COMPLETED");

}

saveGame();

showTransfers();

}


/* =========================================================
   FIXTURES
   ========================================================= */

function showFixtures(){

layout(`

<h2>Fixtures</h2>

<div class="card">

<table>

<tr>
<th>Matchday</th>
<th>Opponent</th>
<th>Venue</th>
<th>Status</th>
</tr>

${game.fixtures.map(f=>`

<tr>

<td>${f.week}</td>

<td>${f.opponent}</td>

<td>${f.home?"Home":"Away"}</td>

<td>
${
f.played
?
f.result
:
f.week===game.played+1
?
`<button onclick="playNextMatch()">PLAY</button>`
:
"Upcoming"
}
</td>

</tr>

`).join("")}

</table>

</div>

`);

}


/* =========================================================
   MATCH ENGINE
   ========================================================= */

function playNextMatch(){

let fixture=game.fixtures.find(x=>!x.played);

if(!fixture)return;

let avg=

game.players.reduce((sum,p)=>sum+p.overall,0)
/
game.players.length;

let fitness=

game.players.reduce((sum,p)=>sum+p.fitness,0)
/
game.players.length;

let tacticalBonus=0;

if(game.tactic==="Very Attacking")tacticalBonus=2;
if(game.tactic==="Attacking")tacticalBonus=1;
if(game.tactic==="Positive")tacticalBonus=.5;
if(game.tactic==="Defensive")tacticalBonus=-1;
if(game.tactic==="Very Defensive")tacticalBonus=-2;

let strength=avg+(fitness-80)/20+tacticalBonus;

let opponentStrength=
80+Math.random()*12;

let homeBonus=fixture.home?2:0;

let scoreDifference=
strength+homeBonus-opponentStrength+
(Math.random()*12-6);

let gf,ga;

if(scoreDifference>6){
gf=3;ga=Math.random()<.35?0:1;
}
else if(scoreDifference>2){
gf=2;ga=Math.random()<.45?0:1;
}
else if(scoreDifference>-2){
gf=Math.random()<.5?1:2;
ga=1;
}
else if(scoreDifference>-6){
gf=1;ga=2;
}
else{
gf=Math.random()<.35?0:1;
ga=3;
}

fixture.played=true;
fixture.result=game.club+" "+gf+"-"+ga+" "+fixture.opponent;

game.played++;

game.goalsFor+=gf;
game.goalsAgainst+=ga;

if(gf>ga){
game.wins++;
game.points+=3;
game.boardConfidence=Math.min(100,game.boardConfidence+2);

game.news.push(
"Matchday "+fixture.week+": Victory against "+fixture.opponent+"."
);

}
else if(gf===ga){

game.draws++;
game.points+=1;

game.news.push(
"Matchday "+fixture.week+": Draw against "+fixture.opponent+"."
);

}
else{

game.losses++;
game.boardConfidence=Math.max(0,game.boardConfidence-3);

game.news.push(
"Matchday "+fixture.week+": Defeat against "+fixture.opponent+"."
);

}

game.leaguePosition=
Math.max(
1,
Math.min(
10,
6-Math.floor((game.points-game.played*1.5)/8)
)
);

game.players.forEach(p=>{

p.fitness=Math.max(
45,
p.fitness-(8+Math.random()*7)
);

p.sharpness=Math.min(
100,
p.sharpness+2
);

p.appearances++;

if(Math.random()<.03){

p.status="Injured";

game.news.push(
p.name+" has suffered an injury."
);

}

});

saveGame();

alert(
fixture.result+
"\n\nLeague points: "+game.points
);

dashboard();

}


/* =========================================================
   LEAGUE TABLE
   ========================================================= */

function showTable(){

let clubsTable=[
game.club,
"Real Madrid",
"Manchester City",
"Liverpool",
"Bayern Munich",
"Inter Milan",
"Arsenal",
"Juventus",
"PSG",
"Atlético Madrid"
];

let rows=clubsTable.map((name,i)=>{

let pts;

if(i===0)pts=game.points;
else pts=Math.max(
0,
game.points+
Math.floor(Math.random()*20)-15
);

return {
name:name,
played:game.played,
pts:pts
};

});

rows.sort((a,b)=>b.pts-a.pts);

layout(`

<h2>League Table</h2>

<div class="card">

<table>

<tr>
<th>#</th>
<th>Club</th>
<th>Played</th>
<th>Points</th>
</tr>

${rows.map((r,i)=>`

<tr>

<td>${i+1}</td>

<td>
<strong>${r.name}</strong>
</td>

<td>${r.played}</td>

<td>${r.pts}</td>

</tr>

`).join("")}

</table>

</div>

`);

}


/* =========================================================
   BOARD
   ========================================================= */

function showBoard(){

layout(`

<h2>Board</h2>

<div class="grid">

<div class="card">

<h3>Board Confidence</h3>

<div class="big">${game.boardConfidence}%</div>

<div class="bar">
<span style="width:${game.boardConfidence}%"></span>
</div>

</div>

<div class="card">

<h3>Season Objective</h3>

<p>${clubs[game.clubKey].expectation}</p>

</div>

<div class="card">

<h3>Financial Situation</h3>

<p>Transfer budget: ${money(game.money)}</p>

<p>Wage budget: ${wage(game.wageBudget)}</p>

</div>

</div>

`);

}


/* =========================================================
   INBOX
   ========================================================= */

function showInbox(){

layout(`

<h2>Inbox</h2>

${game.inbox.length===0
?
`<div class="card">No new messages.</div>`
:
game.inbox.reverse().map(x=>
`<div class="card" style="margin-bottom:10px">${x}</div>`
).join("")
}

`);

}


/* =========================================================
   INITIALIZE
   ========================================================= */

if(game){
dashboard();
}
else{
startScreen();
}

</script>

</body>
</html>
